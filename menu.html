<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ri8 FOODS - Menu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f1e7;
      color: #3a1d08;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fffaf2;
      border: 1px solid #d8c8b1;
      border-radius: 24px;
      padding: 40px 24px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(58, 29, 8, 0.08);
    }

    .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
      font-size: 42px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 4px;
      margin-bottom: 28px;
    }

    .line {
      width: 100%;
      max-width: 380px;
      height: 5px;
      margin: 0 auto 28px;
      background: #cbb28f;
      border-radius: 10px;
    }

    p {
      margin: 0 auto 26px;
      max-width: 390px;
      color: #5b4634;
      line-height: 1.6;
      font-size: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      max-width: 360px;
      margin: 12px auto;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 15px;
      border: 2px solid #3a1d08;
      cursor: pointer;
    }

    .view {
      background: #3a1d08;
      color: #ffffff;
    }

    .download {
      background: #eadfce;
      color: #3a1d08;
    }

    .note {
      margin-top: 24px;
      font-size: 12px;
      color: #7a6755;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="brand">Ri8 FOODS</div>

    <h1>MENU</h1>

    <div class="subtitle">
      FRESH • FIT • FLAVOURFUL
    </div>

    <div class="line"></div>

    <p>
      Explore the latest Ri8 FOODS menu and choose how you'd like to view it.
    </p>

    <a
      class="btn view"
      href="Ri8_foods_menu.pdf">
      VIEW MENU
    </a>

    <a
      class="btn download"
      href="Ri8_foods_menu.pdf"
      download="Ri8_foods_menu.pdf">
      DOWNLOAD MENU
    </a>

    <div class="note">
      Menu may be updated from time to time.
    </div>

  </main>

</body>
</html>
