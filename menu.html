<title>Ri8 FOODS – Menu</title>
<style>
:root {
  --cream:#f7f1e7; --brown:#3a1d08; --tan:#cbb28f;
  --soft:#eadfce; --accent:#a66b32; --line:#d8c8b1;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; background:var(--cream); color:var(--brown);
  font-family:Arial, Helvetica, sans-serif; display:flex; align-items:center;
  justify-content:center; padding:24px;
}
.card {
  width:min(520px,100%); text-align:center; background:rgba(255,250,242,.8);
  border:1px solid var(--line); border-radius:24px; padding:34px 24px 28px;
  box-shadow:0 10px 30px rgba(58,29,8,.08);
}
.logo { width:120px; height:120px; object-fit:contain; }
.brand { margin-top:12px; font-size:14px; letter-spacing:4px; font-weight:700; }
h1 { margin:14px 0 6px; font-family:Georgia,serif; font-size:38px; letter-spacing:1px; }
.subtitle { letter-spacing:4px; font-size:13px; margin-bottom:28px; }
.rule { height:5px; background:var(--tan); border-radius:10px; margin:0 auto 26px; max-width:380px; }
p { color:#5b4634; line-height:1.5; margin:0 auto 24px; max-width:390px; }
.btn {
  display:block; width:100%; max-width:360px; margin:12px auto; padding:15px 20px;
  border-radius:12px; text-decoration:none; font-weight:700; letter-spacing:1px;
  border:2px solid var(--brown);
}
.view { background:var(--brown); color:white; }
.download { background:var(--soft); color:var(--brown); }
.small { margin-top:22px; font-size:12px; color:#7a6755; }
</style>
